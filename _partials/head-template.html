<script>(function () {
    let mobileTicker;

    function initMobileTicker() {
      const isMobile = window.innerWidth < 992;
      if (!isMobile) {
        if (mobileTicker) { mobileTicker.destroy(true, true); mobileTicker = null; }
        return;
      }
      if (mobileTicker) return;

      mobileTicker = new Swiper('.brand-swiper', {
  loop: true,
  slidesPerView: 'auto',
  spaceBetween: 12,
  allowTouchMove: false,
  freeMode: true,
  freeModeMomentum: false,
  watchOverflow: true,
  speed: 4000,
  autoplay: {
    delay: 0,
    disableOnInteraction: false,
    pauseOnMouseEnter: false,
  },
});

document.querySelector('.brand-swiper .swiper-wrapper')
  .style.transitionTimingFunction = 'linear';

      const wrapper = document.querySelector('.brand-swiper .swiper-wrapper');
      if (wrapper) wrapper.style.transitionTimingFunction = 'linear';
    }

    window.addEventListener('DOMContentLoaded', initMobileTicker);
    window.addEventListener('resize', function(){
      clearTimeout(window._brandResizeTimer);
      window._brandResizeTimer = setTimeout(initMobileTicker, 120);
    });
  })();</script><link rel="stylesheet" href="css/wpcode-snippets.css" media="all">
<script>document.addEventListener("DOMContentLoaded", function () {
  let customMobileSlider;

  function initCustomMobileSlider() {
    if (window.innerWidth < 992 && !customMobileSlider) {
      customMobileSlider = new Swiper(".custom-mobile-slider", {
        slidesPerView: 2.2,
        spaceBetween: 20,
		  speed: 8000,
        loop: true,
        autoplay: {
          delay: 0,
          disableOnInteraction: false,
        },
      });
    } else if (window.innerWidth >= 992 && customMobileSlider) {
      customMobileSlider.destroy(true, true);
      customMobileSlider = undefined;
    }
  }

  initCustomMobileSlider();
  window.addEventListener("resize", initCustomMobileSlider);
});</script><script>(function($) {
    $(document).ready(function() {
        var newsSlider = $('.newspost1');

        newsSlider.owlCarousel({
            loop: true,
            margin: 20,
            autoplay: true,
            autoplayTimeout: 3000,
            dots: true,
            nav: false,
            responsive: {
                0: { items: 1, margin: 10 },
                600: { items: 2 },
                1000: { items: 3 }
            },
            onInitialized: updateCarousel,
            onTranslated: updateCarousel
        });

        function updateCarousel() {
            $('.newspost1 .owl-item').each(function() {
                var $item = $(this);
                var author = $item.find('.quote-author').text();
                if (!$item.find('.quote-author-display').length && author) {
                    $item.append('<div class="quote-author-display">' + author + '</div>');
                }
                $item.find('.quote-author-display').css('color', '#999');
            });

            var activeItems = $('.newspost1 .owl-item.active');
            var centerIndex = Math.floor(activeItems.length / 2);
            activeItems.find('.quote-description').removeClass('quote-box');
            activeItems.eq(centerIndex).find('.quote-description').addClass('quote-box');
            activeItems.eq(centerIndex).find('.quote-author-display').css('color', '#192e59');
        }
    });
})(jQuery);
